[package]
name = "ssh3-server"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
publish = false
description = "Minimal Rust SSH3 server runtime and binary"
authors = [
    "Matias Hiltunen <26164588+MatiasHiltunen@users.noreply.github.com>",
    "nagual2 <912140+nagual2@users.noreply.github.com>",
]
repository = "https://github.com/nagual2/ssh3-rust"
homepage = "https://github.com/nagual2/ssh3-rust"
documentation = "https://docs.rs/ssh3-server"
readme = "../README.md"
keywords = ["ssh3", "quic", "http3", "ssh"]
categories = ["network-programming", "command-line-utilities"]

[lib]
path = "src/lib.rs"

[[bin]]
name = "ssh3-rust-server"
path = "src/main.rs"

[dependencies]
base64 = "0.22.1"
clap = { version = "4.5.39", features = ["derive"] }
h3 = "0.0.8"
http = "1.3.1"
quinn = "0.11.12"
russh-sftp = "3.0.1"
ssh3-auth = { path = "../ssh3-auth" }
ssh3-core = { path = "../ssh3-core" }
ssh3-h3 = { path = "../ssh3-h3" }
ssh3-proto = { path = "../ssh3-proto" }
ssh3-quinn = { path = "../ssh3-quinn" }
tokio = { version = "1.48.0", features = [
    "fs",
    "io-std",
    "io-util",
    "macros",
    "net",
    "process",
    "rt-multi-thread",
    "time",
] }

[dev-dependencies]
futures-util = "0.3.31"
p256 = { version = "0.13.2", features = ["ecdsa"] }
rand_core = { version = "0.6.4", features = ["getrandom"] }
rsa = { version = "0.9.10", features = ["sha2"] }
sha2 = "0.10.9"
signature = "2.2.0"
ssh-key = { version = "0.6.7", features = ["ed25519", "p256", "rsa"] }
tempfile = "3.23.0"
tokio = { version = "1.48.0", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "time"] }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.29.0", features = ["fs", "signal", "term", "user"] }
