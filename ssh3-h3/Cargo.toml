[package]
name = "ssh3-h3"
version = "0.2.3"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
publish = false
description = "HTTP/3 transport helpers for the Rust SSH3 rewrite"
authors = [
    "Matias Hiltunen <26164588+MatiasHiltunen@users.noreply.github.com>",
    "nagual2 <912140+nagual2@users.noreply.github.com>",
]
repository = "https://github.com/nagual2/ssh3-rust"
homepage = "https://github.com/nagual2/ssh3-rust"
documentation = "https://docs.rs/ssh3-h3"
readme = "../README.md"
keywords = ["ssh3", "quic", "http3", "ssh"]
categories = ["network-programming", "command-line-utilities"]

[lib]
path = "src/lib.rs"

[dependencies]
bytes = "1.10.1"
h3 = "0.0.8"
h3-quinn = "0.0.10"
http = "1.3.1"
ssh3-core = { path = "../ssh3-core" }
ssh3-proto = { path = "../ssh3-proto" }
ssh3-quinn = { path = "../ssh3-quinn" }

[dev-dependencies]
futures-util = "0.3.31"
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread", "sync", "time"] }
