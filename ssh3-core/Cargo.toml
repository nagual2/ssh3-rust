[package]
name = "ssh3-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
publish = false
description = "Rust SSH3 conversation and channel runtime"
authors = [
    "Matias Hiltunen <26164588+MatiasHiltunen@users.noreply.github.com>",
    "nagual2 <912140+nagual2@users.noreply.github.com>",
]
repository = "https://github.com/nagual2/ssh3-rust"
homepage = "https://github.com/nagual2/ssh3-rust"
documentation = "https://docs.rs/ssh3-core"
readme = "../README.md"
keywords = ["ssh3", "quic", "http3", "ssh"]
categories = ["network-programming", "command-line-utilities"]

[lib]
path = "src/lib.rs"

[dependencies]
async-trait = "0.1.89"
ssh3-proto = { path = "../ssh3-proto" }
tokio = { version = "1.48.0", features = ["io-util", "macros", "rt", "sync"] }

[dev-dependencies]
tokio = { version = "1.48.0", features = ["macros", "rt", "time"] }

