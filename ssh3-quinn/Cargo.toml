[package]
name = "ssh3-quinn"
version = "0.2.1"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
publish = false
description = "Quinn transport bindings for the Rust SSH3 runtime"
authors = [
    "Matias Hiltunen <26164588+MatiasHiltunen@users.noreply.github.com>",
    "nagual2 <912140+nagual2@users.noreply.github.com>",
]
repository = "https://github.com/nagual2/ssh3-rust"
homepage = "https://github.com/nagual2/ssh3-rust"
documentation = "https://docs.rs/ssh3-quinn"
readme = "../README.md"
keywords = ["ssh3", "quic", "http3", "ssh"]
categories = ["network-programming", "command-line-utilities"]

[lib]
path = "src/lib.rs"

[dependencies]
async-trait = "0.1.89"
bytes = "1.10.1"
quinn = "0.11.12"
rcgen = "0.14.7"
rustls = "0.23.46"
ssh3-core = { path = "../ssh3-core" }
ssh3-proto = { path = "../ssh3-proto" }
webpki-roots = "1.0.10"

[dev-dependencies]
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread", "time"] }
