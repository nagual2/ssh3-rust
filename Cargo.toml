[workspace]
members = [
    "ssh3-auth",
    "ssh3-client",
    "ssh3-core",
    "ssh3-h3",
    "ssh3-proto",
    "ssh3-quinn",
    "ssh3-server",
]
# The fuzz crate is built on its own, with the nightly toolchain that
# `cargo fuzz` requires; it is not a member of the workspace.
exclude = ["fuzz"]
resolver = "3"

[patch.crates-io]
h3 = { path = "vendor/h3" }
