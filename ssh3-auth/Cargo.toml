[package]
name = "ssh3-auth"
version = "0.2.4"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
publish = false
description = "Shared SSH3 authentication helpers"
authors = [
    "Matias Hiltunen <26164588+MatiasHiltunen@users.noreply.github.com>",
    "nagual2 <912140+nagual2@users.noreply.github.com>",
]
repository = "https://github.com/nagual2/ssh3-rust"
homepage = "https://github.com/nagual2/ssh3-rust"
documentation = "https://docs.rs/ssh3-auth"
readme = "../README.md"
keywords = ["ssh3", "quic", "http3", "ssh"]
categories = ["network-programming", "command-line-utilities"]

[lib]
path = "src/lib.rs"

[dependencies]
base64 = "0.22.1"
p256 = { version = "0.13.2", features = ["ecdsa"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rsa = { version = "0.9.10", features = ["sha2"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
signature = "2.2.0"
ssh-key = { version = "0.6.7", features = ["ed25519", "p256", "rsa"] }

[dev-dependencies]
rand_core = { version = "0.6.4", features = ["getrandom"] }
tokio = { version = "1.48.0", features = ["io-util", "macros", "net", "rt-multi-thread"] }
