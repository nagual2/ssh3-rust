[package]
name = "ssh3-client"
version = "0.2.1"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
publish = false
description = "Minimal Rust SSH3 client runtime and binary"
authors = [
    "Matias Hiltunen <26164588+MatiasHiltunen@users.noreply.github.com>",
    "nagual2 <912140+nagual2@users.noreply.github.com>",
]
repository = "https://github.com/nagual2/ssh3-rust"
homepage = "https://github.com/nagual2/ssh3-rust"
documentation = "https://docs.rs/ssh3-client"
readme = "../README.md"
keywords = ["ssh3", "quic", "http3", "ssh"]
categories = ["network-programming", "command-line-utilities"]

[lib]
path = "src/lib.rs"

[[bin]]
name = "ssh3"
path = "src/main.rs"

[dependencies]
base64 = "0.22.1"
clap = { version = "4.5.39", features = ["derive"] }
h3 = "0.0.8"
http = "1.3.1"
quinn = "0.11.12"
rand = "0.8.6"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
russh-sftp = "3.0.1"
rustls = "0.23.46"
rustls-pemfile = "2.2.0"
serde = { version = "1.0.228", features = ["derive"] }
sha1 = "0.10"
sha2 = "0.10.9"
ssh-key = { version = "0.6.7", features = ["ed25519", "p256", "rsa"] }
ssh3-core = { path = "../ssh3-core" }
ssh3-h3 = { path = "../ssh3-h3" }
ssh3-auth = { path = "../ssh3-auth" }
ssh3-proto = { path = "../ssh3-proto" }
ssh3-quinn = { path = "../ssh3-quinn" }
serde_json = "1.0.145"
tokio = { version = "1.48.0", features = [
    "fs",
    "io-std",
    "io-util",
    "macros",
    "net",
    "rt-multi-thread",
    "signal",
    "sync",
    "time",
] }
url = "2.5.8"
webpki-roots = "1.0.10"
x509-parser = { version = "0.18.1", features = ["verify"] }

[dev-dependencies]
p256 = { version = "0.13.2", features = ["ecdsa"] }
rand_core = { version = "0.6.4", features = ["getrandom"] }
rcgen = "0.14.7"
rsa = { version = "0.9.10", features = ["sha2"] }
sha2 = "0.10.9"
signature = "2.2.0"
ssh3-server = { path = "../ssh3-server" }
tempfile = "3.23.0"
tokio = { version = "1.48.0", features = ["fs", "io-std", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.29.0", features = ["term"] }
