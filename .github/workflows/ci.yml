name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - name: Check out the workspace
        uses: actions/checkout@v4
      - name: Install the Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
      - name: Build
        run: cargo build --workspace --locked
      - name: Check the formatting
        run: cargo fmt --all -- --check
      - name: Run clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - name: Check out the workspace
        uses: actions/checkout@v4
      - name: Install the Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
      - name: Run the test suite
        # No Go checkout here: the interop scenarios resolve their peers
        # through SSH3_GO_REPO, and they skip with a `skipping:` line instead
        # of failing when the Go repository is not available.
        run: cargo test --workspace --locked

  interop:
    name: interop
    runs-on: ubuntu-latest
    steps:
      - name: Check out the workspace
        uses: actions/checkout@v4
      # The Go reference repository is pinned to a release tag on purpose.
      # `main` carries quic-go v0.63.0, while the frozen `h3` 0.0.8 shim of
      # this workspace only speaks the HTTP/3 version of the quic-go v0.40.x
      # line; against `main` the interop scenarios abort with an HTTP/3
      # 0x104 error. That failure is a wire incompatibility of the Go side,
      # not a regression of the Rust code, so the checkout stays on the tag
      # v0.1.12 until the shim is updated.
      - name: Check out the Go reference repository
        uses: actions/checkout@v4
        with:
          repository: nagual2/ssh3-go
          ref: v0.1.12
          path: ssh3-go
      - name: Install the Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
      - name: Install the Go toolchain
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Run the interop matrix
        env:
          SSH3_GO_REPO: ${{ github.workspace }}/ssh3-go
        run: cargo test -p ssh3-client --locked

  audit:
    name: audit
    runs-on: ubuntu-latest
    # The advisory database is fetched from the network: a network outage must
    # not turn the audit into a red build, and the finding list is reviewed
    # separately (see SECURITY.md).
    continue-on-error: true
    steps:
      - name: Check out the workspace
        uses: actions/checkout@v4
      - name: Install the Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
      - name: Install cargo-audit
        uses: taiki-e/install-action@cargo-audit
      - name: Scan the dependency tree
        # The known advisories are tracked in SECURITY.md; updating the
        # affected dependencies is staged in ROADMAP.md (M2, M3). The audit
        # reports them without blocking the pipeline.
        continue-on-error: true
        run: cargo audit
