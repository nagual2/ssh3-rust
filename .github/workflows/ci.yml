name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - name: Check out the workspace
        uses: actions/checkout@v7
      - name: Install the Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
      - name: Build
        run: cargo build --workspace --locked
      - name: Check the formatting
        run: cargo fmt --all -- --check
      - name: Run clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - name: Check out the workspace
        uses: actions/checkout@v7
      - name: Install the Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
      - name: Run the test suite
        # No Go checkout here: the interop scenarios resolve their peers
        # through SSH3_GO_REPO, and they skip with a `skipping:` line instead
        # of failing when the Go repository is not available.
        run: cargo test --workspace --locked

  cross-build:
    name: cross-build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    # The Windows leg is informational for now: the workspace compiles for
    # the Windows target (the unix-only agent socket accessor was made
    # platform neutral), but the msvc toolchain of the runner cannot be
    # reproduced locally, so the leg stays non-blocking until it has proven
    # itself in the pipeline. The macOS leg is expected to pass.
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          # The Linux build is covered by the `build` job above; this matrix
          # covers the other two platforms the SSH3 client and server are
          # expected to run on.
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: aarch64-apple-darwin
    steps:
      - name: Check out the workspace
        uses: actions/checkout@v7
      - name: Install the Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          targets: ${{ matrix.target }}
      - name: Check the workspace
        # A part of the code is `#[cfg(unix)]` (the `nix` based terminal and
        # session handling); this job makes sure that the platform specific
        # code does not break the build on the other platforms.
        run: cargo check --workspace --locked --target ${{ matrix.target }}

  client-windows:
    name: client (windows)
    runs-on: windows-latest
    # The Windows client is a first-class citizen: the console handling, the
    # resize polling and the control events of the console live behind the
    # `#[cfg(windows)]` modules of the client, and this job runs the test
    # suite of the client on a Windows runner instead of only checking that
    # it compiles.
    steps:
      - name: Check out the workspace
        uses: actions/checkout@v7
      - name: Install the Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          components: clippy
      - name: Run the linter for the Windows target
        # The linter of the native target covers the Windows code paths of
        # the client: the console modes, the geometry of the console and the
        # control events.
        run: cargo clippy -p ssh3-client --all-targets --locked -- -D warnings
      - name: Run the client test suite
        # The interactive scenarios need a local console with a pty, and the
        # server side still runs the remote commands with `/bin/sh`: those
        # scenarios stay unix-only and are covered by the `test` and the
        # `interop` jobs above. The Windows run covers the platform neutral
        # scenarios of the client and the unit tests of the Windows
        # console (the geometry of the window, the raw mode and the
        # mapping of the control events).
        run: cargo test -p ssh3-client --locked

  interop:
    name: interop
    runs-on: ubuntu-latest
    steps:
      - name: Check out the workspace
        uses: actions/checkout@v7
      # The Go reference repository is pinned to a release tag on purpose: the
      # interop matrix is verified against a specific Go release, not against
      # `main`.
      #
      # The tag was v0.1.12 for a long time. That release is on the
      # quic-go v0.40.x line, and the `h3` 0.0.8 shim of this workspace was
      # believed to speak only the HTTP/3 dialect of that line: against the
      # newer releases (quic-go v0.49.0 and later, v0.1.19 and later) the
      # scenarios aborted with an HTTP/3 0x104 error, so the checkout stayed
      # on the old tag.
      #
      # That diagnosis was wrong. The `h3` 0.0.8 shim already implements the
      # final HTTP/3 (RFC 9114: the same setting identifiers, the same ALPN
      # and the same QPACK static table as the current quic-go), and the three
      # local edits of the shim are all still needed by the new Go. The real
      # blocker of the newer quic-go was a different one: a peer that
      # announces the HTTP/3 datagram support (SETTINGS_H3_DATAGRAM, 0x33)
      # opens a second reader on the connection-wide QUIC datagram queue and
      # steals the SSH3 datagrams (quic-go does it in the HTTP/3 layer of the
      # connection, `handleControlStream`). The SSH3 datagrams travel over the
      # QUIC datagram API and not over the HTTP/3 datagram extension, so the
      # Rust side does not announce the HTTP/3 datagram support anymore
      # (`ssh3-h3`, `configure_client_builder` and `configure_server_builder`).
      #
      # The checkout is now on the latest release of the Go fork, v0.1.39
      # (quic-go v0.63.0). The reverse forwarding (v0.1.23) and the dynamic
      # forwarding (v0.1.24) exist from there on, so their scenarios run
      # against the reference instead of skipping with a `skipping:` line.
      #
      # Known gap: the scenarios that drive the *Go* client against the Rust
      # server (`real_go_client_*`) fail with the new reference. The Go
      # client keeps reading the session channel until the server closes it
      # (the exit status does not end the byte stream), and the Rust server
      # does not close the channel after the exit status: it waits for the
      # half close of the client and never sends the EOF the client waits
      # for. The gap belongs to the server side (`ssh3-server`), not to the
      # HTTP/3 layer, and it is tracked there.
      - name: Check out the Go reference repository
        uses: actions/checkout@v7
        with:
          repository: nagual2/ssh3-go
          ref: v0.1.39
          path: ssh3-go
      - name: Install the Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
      - name: Install the Go toolchain
        uses: actions/setup-go@v7
        with:
          # The Go fork requires Go 1.26 (`go 1.26.0` in its go.mod).
          go-version: "1.26"
      - name: Run the interop matrix
        env:
          SSH3_GO_REPO: ${{ github.workspace }}/ssh3-go
        run: cargo test -p ssh3-client --locked

  audit:
    name: audit
    runs-on: ubuntu-latest
    # The advisory database is fetched from the network: a network outage must
    # not turn the audit into a red build. The blocking gate for the
    # dependency policy is the `deny` job below, which uses the same
    # advisory database but with an explicit allow list.
    continue-on-error: true
    steps:
      - name: Check out the workspace
        uses: actions/checkout@v7
      - name: Install the Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
      - name: Install cargo-audit
        uses: taiki-e/install-action@cargo-audit
      - name: Scan the dependency tree
        # The two accepted risks are ignored here as well, so that the audit
        # output matches the allow list of `deny.toml`:
        #   RUSTSEC-2023-0071 - rsa / Marvin attack, no upstream fix exists.
        #   RUSTSEC-2025-0134 - rustls-pemfile is unmaintained, informational.
        # Both are documented in SECURITY.md.
        continue-on-error: true
        run: cargo audit --ignore RUSTSEC-2023-0071 --ignore RUSTSEC-2025-0134

  deny:
    name: deny
    runs-on: ubuntu-latest
    # Blocking gate for the dependency policy: advisories, duplicate and
    # forbidden crates, licenses and dependency sources. The accepted risks
    # are listed with their justification in `deny.toml`.
    steps:
      - name: Check out the workspace
        uses: actions/checkout@v7
      - name: Install the Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
      - name: Install cargo-deny
        uses: taiki-e/install-action@cargo-deny
      - name: Run the dependency policy checks
        run: cargo deny check

  shim:
    name: shim
    runs-on: ubuntu-latest
    # The `h3` crate is overridden by the local shim in `vendor/h3`. The
    # shim has to stay reproducible: the script rebuilds the vendored tree
    # from the pristine crates.io release plus `patches/h3-0.0.8.patch` and
    # fails the build when the two drift apart.
    steps:
      - name: Check out the workspace
        uses: actions/checkout@v7
      - name: Verify the vendored h3 shim
        # The script is invoked through `bash` on purpose: the repository is
        # checked out with `core.filemode=false` on Windows, so the
        # executable bit of the script is not recorded in the index.
        run: bash ./scripts/verify-h3-shim.sh
